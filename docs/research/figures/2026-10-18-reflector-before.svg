<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title" color="#1c1b19" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="title">One recursion level is regulated: inside the instance every channel is typed and every writer is named, the definition above is changed only by people, the records flow out to a column nothing reads back up, and the slot for the definition's own S4 holds a checklist a person runs.</title>
<rect fill="#fbfaf6" x="0" y="0" width="1040" height="640"/>
  <defs>
    <marker id="b-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
  </defs>
  <g font-size="12" fill="currentColor" stroke="currentColor">
    <rect x="30" y="20" width="730" height="96" rx="6" fill="none" stroke-width="1.5"/>
    <text x="46" y="42" font-weight="600" stroke="none">DEFINITION</text>
    <text x="140" y="42" stroke="none" fill="#5c574f">versioned, checked by <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">regulator check</tspan>, changed by people</text>
    <rect x="46" y="58" width="108" height="34" rx="3" fill="#f0ede6" stroke-width="1.2"/>
    <text x="100" y="79" stroke="none" text-anchor="middle" font-size="11.5">registry (43)</text>
    <rect x="162" y="58" width="108" height="34" rx="3" fill="#f0ede6" stroke-width="1.2"/>
    <text x="216" y="79" stroke="none" text-anchor="middle" font-size="11.5">identity seed</text>
    <rect x="278" y="58" width="108" height="34" rx="3" fill="#f0ede6" stroke-width="1.2"/>
    <text x="332" y="79" stroke="none" text-anchor="middle" font-size="11.5">profiles</text>
    <rect x="394" y="58" width="108" height="34" rx="3" fill="#f0ede6" stroke-width="1.2"/>
    <text x="448" y="79" stroke="none" text-anchor="middle" font-size="11.5">policies</text>
    <rect x="510" y="58" width="108" height="34" rx="3" fill="#f0ede6" stroke-width="1.2"/>
    <text x="564" y="79" stroke="none" text-anchor="middle" font-size="11.5">workloads</text>
    <rect x="626" y="58" width="108" height="34" rx="3" fill="#f0ede6" stroke-width="1.2"/>
    <text x="680" y="79" stroke="none" text-anchor="middle" font-size="11.5">evals</text>
    <rect x="780" y="20" width="230" height="96" rx="6" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="792" y="42" font-weight="600" stroke="none">THE DEFINITION'S S4</text>
    <text x="792" y="62" stroke="none" font-size="10.5" fill="#5c574f">today: a checklist a person runs</text>
    <text x="792" y="78" stroke="none" font-size="10.5" fill="#5c574f">(the Pi upgrade, the review dates)</text>
    <text x="792" y="94" stroke="none" font-size="10.5" fill="#5c574f">nothing models what the instance did</text>
    <line x1="80" y1="116" x2="80" y2="176" stroke-width="1.5" marker-end="url(#b-arrow)"/>
    <text x="86" y="150" stroke="none" font-size="10" fill="#5c574f"><tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">regulator init</tspan> seeds</text>
    <line x1="236" y1="212" x2="236" y2="94" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b-arrow)"/>
    <text x="242" y="150" stroke="none" font-size="10" fill="#5c574f"><tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">identity promote</tspan></text>
    <rect x="30" y="176" width="730" height="424" rx="6" fill="none" stroke-width="1.5"/>
    <text x="46" y="198" font-weight="600" stroke="none">INSTANCE</text>
    <text x="126" y="198" stroke="none" fill="#5c574f">one repository under the control plane</text>
    <rect x="46" y="212" width="330" height="40" rx="3" fill="#f0ede6" stroke-width="1.2"/>
    <text x="56" y="229" stroke="none" font-weight="600">S5</text>
    <text x="80" y="229" stroke="none">identity files, write-protected</text>
    <text x="80" y="244" stroke="none" font-size="11" fill="#5c574f">write gate · bash watch · identity-untouched at closeout</text>
    <rect x="430" y="212" width="190" height="40" rx="20" fill="none" stroke-width="1.5"/>
    <text x="525" y="236" stroke="none" text-anchor="middle">a person (<tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">actAsS5</tspan>)</text>
    <line x1="430" y1="232" x2="378" y2="232" stroke-width="1.5" marker-end="url(#b-arrow)"/>
    <text x="404" y="226" stroke="none" font-size="10" text-anchor="middle" fill="#5c574f">accept</text>
    <text x="404" y="262" stroke="none" font-size="10" text-anchor="middle" fill="#5c574f">the only writer</text>
    <rect x="46" y="290" width="574" height="40" rx="3" fill="none" stroke-width="1.5"/>
    <text x="56" y="314" stroke="none" font-weight="600">S3</text>
    <text x="80" y="314" stroke="none">the loop: contract → dispatch → verify → route → close; budgets; recovery policy</text>
    <rect x="46" y="372" width="130" height="44" rx="3" fill="#f0ede6" stroke-width="1.2"/>
    <rect x="190" y="372" width="130" height="44" rx="3" fill="#f0ede6" stroke-width="1.2"/>
    <rect x="334" y="372" width="160" height="44" rx="3" fill="#f0ede6" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="56" y="389" stroke="none" font-weight="600">S1</text><text x="78" y="389" stroke="none">unit u1</text>
    <text x="56" y="405" stroke="none" font-size="11" fill="#5c574f">implement · worktree</text>
    <text x="200" y="389" stroke="none" font-weight="600">S1</text><text x="222" y="389" stroke="none">unit u2</text>
    <text x="200" y="405" stroke="none" font-size="11" fill="#5c574f">implement · worktree</text>
    <text x="344" y="389" stroke="none" font-weight="600">S4</text><text x="366" y="389" stroke="none">research unit</text>
    <text x="344" y="405" stroke="none" font-size="11" fill="#5c574f">read-only · one question</text>
    <text x="46" y="440" stroke="none" font-size="11" fill="#5c574f">S2: leases, worktree isolation, reintegration, thrash detector</text>
    <line x1="111" y1="330" x2="111" y2="370" stroke-width="1.2" marker-end="url(#b-arrow)"/>
    <line x1="255" y1="330" x2="255" y2="370" stroke-width="1.2" marker-end="url(#b-arrow)"/>
    <line x1="409" y1="330" x2="409" y2="370" stroke-width="1.2" marker-end="url(#b-arrow)"/>
    <text x="118" y="352" stroke="none" font-size="10" fill="#5c574f">dispatch</text>
    <rect x="520" y="372" width="200" height="44" rx="3" fill="none" stroke-width="1.5"/>
    <text x="620" y="389" stroke="none" text-anchor="middle">router → obligations</text>
    <text x="620" y="405" stroke="none" text-anchor="middle" font-size="11" fill="#5c574f">routing policy · floors · veto</text>
    <line x1="494" y1="394" x2="518" y2="394" stroke-width="1.5" marker-end="url(#b-arrow)"/>
    <text x="506" y="366" stroke="none" font-size="10" text-anchor="middle" fill="#5c574f">report_intelligence</text>
    <path d="M 620 372 L 620 330" stroke-width="1.5" marker-end="url(#b-arrow)"/>
    <text x="628" y="352" stroke="none" font-size="10" fill="#5c574f">obligation holds the unit</text>
    <path d="M 255 416 L 255 470 L 740 470 L 740 232 L 622 232" stroke-width="1.2" stroke-dasharray="5 4" fill="none" marker-end="url(#b-arrow)"/>
    <text x="262" y="462" stroke="none" font-size="10" fill="#5c574f"><tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">propose_policy_change</tspan> → obligation owed to S5; changes nothing</text>
    <path d="M 300 416 L 300 448 L 600 448 L 600 498" stroke-width="1.2" stroke-dasharray="5 4" fill="none" marker-end="url(#b-arrow)"/>
    <text x="606" y="444" stroke="none" font-size="10" fill="#5c574f"><tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">remember</tspan></text>
    <rect x="46" y="500" width="450" height="40" rx="3" fill="none" stroke-width="1.5"/>
    <text x="56" y="517" stroke="none" font-weight="600">S3*</text>
    <text x="84" y="517" stroke="none">host checks at the revision → evidence → closeout gate</text>
    <text x="84" y="532" stroke="none" font-size="11" fill="#5c574f">inherited-tests · identity-untouched · export-signature · glossary-lint</text>
    <line x1="111" y1="416" x2="111" y2="498" stroke-width="1.2" marker-end="url(#b-arrow)"/>
    <text x="118" y="482" stroke="none" font-size="10" fill="#5c574f">branch at HEAD</text>
    <rect x="520" y="500" width="200" height="40" rx="3" fill="#f0ede6" stroke-width="1.2"/>
    <text x="620" y="517" stroke="none" text-anchor="middle">operational memory</text>
    <text x="620" y="532" stroke="none" text-anchor="middle" font-size="11" fill="#5c574f">facts, provenance, expiry ≤ 90 d</text>
    <text x="46" y="584" stroke="none" font-size="11" fill="#5c574f">Every edge inside the instance is typed, stamped by the host, and recorded on a card with its limitations.</text>
    <rect x="780" y="176" width="230" height="290" rx="6" fill="none" stroke-width="1.5" stroke-dasharray="1 4" stroke-linecap="round"/>
    <text x="796" y="198" font-weight="600" stroke="none">RECORDS</text>
    <text x="796" y="214" stroke="none" font-size="11" fill="#5c574f"><tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">.regulator/</tspan>, append-only</text>
    <text x="796" y="246" stroke="none">execution store</text>
    <text x="796" y="268" stroke="none">regulatory log (signals)</text>
    <text x="796" y="290" stroke="none">audit log (evidence)</text>
    <text x="796" y="312" stroke="none">memory · outbox</text>
    <text x="796" y="334" stroke="none">effect journal</text>
    <text x="796" y="356" stroke="none">spans (OpenTelemetry)</text>
    <text x="796" y="378" stroke="none">eval reports + interpretation</text>
    <text x="796" y="430" stroke="none" font-size="11" fill="#5c574f">read by <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">status</tspan>, the control room,</text>
    <text x="796" y="445" stroke="none" font-size="11" fill="#5c574f">the eval harness, a person.</text>
    <text x="796" y="460" stroke="none" font-size="11" fill="#b4532a">Nothing carries them back up.</text>
    <line x1="760" y1="300" x2="778" y2="300" stroke-width="1.5" marker-end="url(#b-arrow)"/>
    <text x="769" y="292" stroke="none" font-size="10" text-anchor="middle" fill="#5c574f">writes</text>
    <path d="M 850 176 L 850 118" stroke-width="1.2" stroke-dasharray="2 4" marker-end="url(#b-arrow)"/>
    <text x="856" y="150" stroke="none" font-size="10" fill="#5c574f">a person reads the reports</text>
    <rect x="780" y="496" width="230" height="78" rx="6" fill="none" stroke-width="1.5"/>
    <text x="792" y="518" font-weight="600" stroke="none">EVAL HARNESS</text>
    <text x="888" y="518" stroke="none" font-size="10.5" fill="#5c574f">S3* one level up</text>
    <text x="792" y="536" stroke="none" font-size="10.5" fill="#5c574f">arms · ablation · graders · intervals</text>
    <text x="792" y="552" stroke="none" font-size="10.5" fill="#5c574f">a report needs a person's interpretation</text>
    <line x1="900" y1="496" x2="900" y2="468" stroke-width="1.2" marker-end="url(#b-arrow)"/>
    <text x="906" y="486" stroke="none" font-size="10" fill="#5c574f">reports</text>
  </g>
</svg>
