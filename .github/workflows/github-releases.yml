name: GitHub releases

# Creates or updates the GitHub release for tags that already exist, by hand. The release workflow does this for a
# new tag; this one is for the tags published before it did (v0.1.0 to v0.1.3) and for correcting a release's body
# after a changelog fix. The body of each is the changelog's section for the version, read from the branch the
# workflow is run on, so run it on main. A release that exists, a draft included, is edited and published.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Tags to create or update releases for, separated by spaces"
        required: true
        default: "v0.1.0 v0.1.1 v0.1.2 v0.1.3"

permissions:
  contents: write

jobs:
  releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: One release per tag, from the changelog
        run: |
          for tag in $TAGS; do
            case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a version tag: $tag"; exit 1 ;; esac
            scripts/github-release.sh "$tag"
          done
        env:
          TAGS: ${{ inputs.tags }}
          GH_TOKEN: ${{ github.token }}
